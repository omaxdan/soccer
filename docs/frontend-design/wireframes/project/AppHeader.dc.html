<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap"><style>@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}:focus-visible{outline:2px solid #ffb020;outline-offset:2px}:root{--ink:#0b0f14;--panel:#121821;--raised:#1a222e;--line:#1d2633;--text:#f4f6f9;--text-secondary:#c3cbd6;--muted:#90a0b4;--faint:#7e8aa0;--amber:#ffb020;--amber-dim:rgba(255,176,32,.22);--edge:#2fbf87;--risk:#f0544f;--warn:#f5b301;--cool:#4c8dff}</style></helmet>
<header style="position:relative;background:var(--ink);border-bottom:1px solid var(--line);font-family:Inter,-apple-system,'Segoe UI',sans-serif;color:var(--text)">
<sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}">
  <div style="max-width:1152px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;box-sizing:border-box">
    <a style="display:flex;align-items:baseline;gap:6px;text-decoration:none"><span style="font:700 15px Inter,sans-serif;letter-spacing:-.01em;color:var(--text)">Pitch<span style="color:var(--amber)">Terminal</span></span><span style="font:500 9px 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px">V2</span></a>
    <sc-if value="{{ showTagline }}" hint-placeholder-val="{{ true }}"><span style="width:1px;height:16px;background:var(--line)"></span><span style="font:400 10px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">Football Intelligence</span></sc-if>
    <nav aria-label="primary" style="margin-left:auto;display:flex;align-self:stretch;gap:20px">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
        <a style="display:flex;align-items:center;font:500 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:{{ n.color }};border-bottom:2px solid {{ n.border }};margin-bottom:-1px;text-decoration:none;cursor:pointer" style-hover="color:var(--text)">{{ n.label }}</a>
      </sc-for>
    </nav>
    <sc-if value="{{ wideSearch }}" hint-placeholder-val="{{ true }}">
      <button style="display:flex;align-items:center;gap:8px;width:196px;height:32px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:pointer" style-hover="background:var(--raised)">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#90a0b4" stroke-width="1.5"><circle cx="5" cy="5" r="3.8"></circle><line x1="8" y1="8" x2="11" y2="11"></line></svg>
        <span style="font:400 12px Inter,sans-serif;color:var(--muted)">Search</span>
        <span style="margin-left:auto;font:500 10px 'JetBrains Mono',monospace;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:0 4px">/</span>
      </button>
    </sc-if>
    <sc-if value="{{ iconSearch }}" hint-placeholder-val="{{ false }}">
      <button aria-label="Search" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:pointer" style-hover="background:var(--raised)"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#90a0b4" stroke-width="1.5"><circle cx="5" cy="5" r="3.8"></circle><line x1="8" y1="8" x2="11" y2="11"></line></svg></button>
    </sc-if>
    <sc-if value="{{ anon }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;gap:8px">
        <button style="height:32px;padding:0 12px;background:transparent;border:1px solid var(--line);border-radius:4px;font:500 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--text);cursor:pointer" style-hover="background:var(--raised)">Sign in</button>
        <button style="height:32px;padding:0 12px;background:var(--amber);border:1px solid var(--amber);border-radius:4px;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);cursor:pointer">Get access</button>
      </div>
    </sc-if>
    <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:8px">
        <sc-if value="{{ subscribed }}"><span style="font:600 9px 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--amber);background:var(--amber-dim);border-radius:4px;padding:2px 6px">SUBSCRIBED</span></sc-if>
        <button aria-label="Account menu" aria-expanded="{{ menuOpen }}" style="display:flex;align-items:center;gap:6px;height:32px;padding:0 8px 0 4px;background:{{ acctBg }};border:1px solid var(--line);border-radius:4px;cursor:pointer" style-hover="background:var(--raised)"><span style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--raised);border:1px solid var(--line);border-radius:4px;font:700 10px 'JetBrains Mono',monospace;color:var(--muted)">AB</span><span style="font-size:9px;color:var(--faint)">▾</span></button>
      </div>
    </sc-if>
  </div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
  <div style="height:52px;display:flex;align-items:center;gap:8px;padding:0 16px">
    <a style="display:flex;align-items:baseline;text-decoration:none"><span style="font:700 15px Inter,sans-serif;letter-spacing:-.01em;color:var(--text)">Pitch<span style="color:var(--amber)">Terminal</span></span></a>
    <button aria-label="Search" style="margin-left:auto;display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:transparent;border:0;border-radius:4px"><svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="#c3cbd6" stroke-width="1.5"><circle cx="5" cy="5" r="3.8"></circle><line x1="8" y1="8" x2="11" y2="11"></line></svg></button>
    <sc-if value="{{ anon }}"><button style="height:36px;padding:0 12px;background:var(--amber);border:1px solid var(--amber);border-radius:4px;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)">Sign in</button></sc-if>
    <sc-if value="{{ signedIn }}"><button aria-label="Account menu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0"><span style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--raised);border:1px solid var(--line);border-radius:4px;font:700 10px 'JetBrains Mono',monospace;color:var(--muted)">AB</span></button></sc-if>
  </div>
  <nav aria-label="primary" style="display:flex;gap:22px;height:40px;padding:0 16px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
      <a style="flex:none;display:flex;align-items:center;font:500 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:{{ n.color }};border-bottom:2px solid {{ n.border }};margin-bottom:-1px;text-decoration:none">{{ n.label }}</a>
    </sc-for>
  </nav>
</sc-if>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div role="menu" style="position:absolute;right:16px;top:52px;z-index:5;width:220px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:2px">
    <div style="padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column;gap:2px"><span style="font:500 13px Inter,sans-serif;color:var(--text)">Signed-in user</span><span style="font:400 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Account identity · Phase J</span></div>
    <sc-for list="{{ menu }}" as="m" hint-placeholder-count="4">
      <a role="menuitem" style="display:flex;justify-content:space-between;align-items:center;min-height:32px;padding:0 10px;border-radius:4px;font:400 13px Inter,sans-serif;color:{{ m.color }};text-decoration:none;cursor:pointer" style-hover="background:var(--raised)">{{ m.label }}<span style="font:500 9px 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--faint)">{{ m.tag }}</span></a>
    </sc-for>
  </div>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:300},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;auth&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;anon&quot;,&quot;signed&quot;,&quot;subscribed&quot;],&quot;default&quot;:&quot;anon&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;Fixtures&quot;,&quot;Competitions&quot;,&quot;Teams&quot;,&quot;Players&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;menuOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const layout = this.props.layout ?? 'desktop';
    const auth = this.props.auth ?? 'anon';
    const active = this.props.active ?? '';
    const mobile = layout === 'mobile';
    return {
      mobile, notMobile: !mobile,
      showTagline: layout === 'desktop',
      wideSearch: layout === 'desktop', iconSearch: layout === 'tablet',
      anon: auth === 'anon', signedIn: auth !== 'anon', subscribed: auth === 'subscribed',
      menuOpen: !!this.props.menuOpen,
      acctBg: this.props.menuOpen ? 'var(--raised)' : 'transparent',
      nav: ['Fixtures', 'Competitions', 'Teams', 'Players'].map(l => ({
        label: l, color: l === active ? 'var(--text)' : 'var(--muted)', border: l === active ? 'var(--amber)' : 'transparent'
      })),
      menu: [
        { label: 'Account', tag: 'PHASE J', color: 'var(--text-secondary)' },
        { label: 'Subscription', tag: 'PHASE J', color: 'var(--text-secondary)' },
        { label: 'API access', tag: 'FUTURE', color: 'var(--text-secondary)' },
        { label: 'Sign out', tag: '', color: 'var(--text-secondary)' }
      ]
    };
  }
}
</script>
</body>
</html>
